services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  backend:
    build:
      context: ./webapp/backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build:
      context: ./webapp/frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  scraper:
    build:
      context: ./scraper
    depends_on:
      - db
    env_file:
      - .env
    profiles:
      - scraper

volumes:
  pgdata:
