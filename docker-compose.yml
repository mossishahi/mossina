services:

  # ─── Scraper ────────────────────────────────────────────────────────────────
  scraper:
    image: ghcr.io/mossishahi/mossina:latest
    container_name: mossina_scraper
    restart: "no"
    command: ["python", "scrape.py"]
    volumes:
      - mossina_data:/app/data
      - mossina_output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Visualizer ─────────────────────────────────────────────────────────────
  visualizer:
    image: ghcr.io/mossishahi/mossina:latest
    container_name: mossina_visualizer
    restart: "no"
    command: ["python", "visualize.py"]
    volumes:
      - mossina_data:/app/data
      - mossina_output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  mossina_data:
    driver: local
  mossina_output:
    driver: local
