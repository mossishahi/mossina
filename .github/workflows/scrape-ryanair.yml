name: Scrape Ryanair

on:
  schedule:
    - cron: '0 21 * * *'   # 23:00 Berlin (21:00 UTC)
  workflow_dispatch:

jobs:
  scrape:
    name: Run Ryanair scraper
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Run scraper on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 120m
          script: |
            set -e
            cd ~/mossina-dev
            docker compose run --rm scraper python cli.py --airline FR -r 0

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"❌ Ryanair scrape FAILED — check GitHub Actions"}'

      - name: Notify Telegram on success
        if: success()
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"✅ Ryanair scrape completed"}'
