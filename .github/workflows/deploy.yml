name: Deploy to DigitalOcean

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy Full Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GH_PAT,SCRAPFLY_API_KEY
          command_timeout: 15m
          script: |
            set -e
            REPO_DIR=~/mossina-dev
            REPO_URL="https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"

            echo "==> Syncing repo..."
            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" fetch origin
              git -C "$REPO_DIR" checkout production 2>/dev/null || git -C "$REPO_DIR" checkout -b production origin/production
              git -C "$REPO_DIR" reset --hard origin/production
            else
              git clone -b production "$REPO_URL" "$REPO_DIR"
            fi

            echo "==> Updating .env..."
            cd "$REPO_DIR"
            if [ ! -f .env ]; then
              echo "ERROR: .env missing — create it manually first"
              exit 1
            fi
            grep -q SCRAPFLY_API_KEY .env || echo "SCRAPFLY_API_KEY=${SCRAPFLY_API_KEY}" >> .env
            sed -i "s|^SCRAPFLY_API_KEY=.*|SCRAPFLY_API_KEY=${SCRAPFLY_API_KEY}|" .env

            echo "==> Building and deploying services..."
            docker compose build
            docker compose up -d db backend frontend

            echo "==> Waiting for backend health..."
            sleep 10
            curl -sf http://localhost:8000/api/health || (echo "Backend unhealthy" && docker compose logs backend --tail 30 && exit 1)

            echo "==> Syncing cron jobs..."
            cat > /etc/cron.d/mossina << 'CRON'
            # Mossina - managed by GitHub Actions deploy. Do not edit manually.
            SHELL=/bin/bash
            PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

            # 01:30 Berlin (00:30 UTC) - Ryanair full scrape
            30 0 * * * root cd /root/mossina-dev && docker compose --profile scraper run --rm scraper python cli.py --airline FR -r 0 >> /var/log/mossina-scrape.log 2>&1

            # 07:30 Berlin (06:30 UTC) - Wizzair full scrape via ScrapFly
            30 6 * * * root cd /root/mossina-dev && docker compose --profile scraper run --rm scraper python cli.py --airline W6 -r 0 -w 3 >> /var/log/mossina-wizzair.log 2>&1
            CRON
            chmod 0644 /etc/cron.d/mossina

            echo "==> Pruning old images..."
            docker image prune -f

            echo "==> Deploy complete"
            echo "    Frontend: http://$(curl -fsS ifconfig.me):8080"

      - name: Notify Telegram
        if: always()
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ Mossina deployed (${SHA} by ${{ github.actor }})"
          else
            MSG="❌ Mossina deploy failed (${SHA}) — check Actions log"
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${MSG}\"}" \
            > /dev/null 2>&1 || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
