name: Deploy to DigitalOcean

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy Full Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GH_PAT,SCRAPFLY_API_KEY
          command_timeout: 15m
          script: |
            set -e
            REPO_DIR=~/mossina-dev
            REPO_URL="https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"

            echo "==> Syncing repo..."
            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" fetch origin
              git -C "$REPO_DIR" checkout master 2>/dev/null || git -C "$REPO_DIR" checkout -b master origin/master
              git -C "$REPO_DIR" reset --hard origin/master
            else
              git clone -b master "$REPO_URL" "$REPO_DIR"
            fi

            echo "==> Updating .env..."
            cd "$REPO_DIR"
            if [ ! -f .env ]; then
              echo "ERROR: .env missing — create it manually first"
              exit 1
            fi
            grep -q SCRAPFLY_API_KEY .env || echo "SCRAPFLY_API_KEY=${SCRAPFLY_API_KEY}" >> .env
            sed -i "s|^SCRAPFLY_API_KEY=.*|SCRAPFLY_API_KEY=${SCRAPFLY_API_KEY}|" .env

            echo "==> Stopping scrapers if running (avoid OOM during build)..."
            docker stop scraper_fr scraper_w6 2>/dev/null || true
            docker rm scraper_fr scraper_w6 2>/dev/null || true

            echo "==> Building backend + scraper..."
            docker compose --profile scraper build backend scraper

            echo "==> Starting database..."
            docker compose up -d db

            echo "==> Running migrations..."
            docker compose --profile migrate run --rm migrate

            echo "==> Starting backend..."
            docker compose up -d backend

            echo "==> Building frontend (memory-intensive)..."
            docker compose build frontend

            echo "==> Starting frontend..."
            docker compose up -d frontend

            echo "==> Waiting for backend health..."
            sleep 10
            curl -sf http://localhost:8000/api/health || (echo "Backend unhealthy" && docker compose logs backend --tail 30 && exit 1)

            echo "==> Pruning old images..."
            docker image prune -f

            echo "==> Deploy complete"
            echo "    Frontend: http://$(curl -fsS ifconfig.me):8080"

      - name: Notify Telegram
        if: always()
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ Mossina deployed (${SHA} by ${{ github.actor }})"
          else
            MSG="❌ Mossina deploy failed (${SHA}) — check Actions log"
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"${MSG}\"}" \
            > /dev/null 2>&1 || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
