name: Deploy to DigitalOcean

on:
  push:
    branches:
      - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─── 1. Build & push Docker image to GitHub Container Registry ────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Deploy to DigitalOcean Droplet ────────────────────────────────────
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into Droplet and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: HEALTHCHECK_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -e

            echo "==> Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pulling latest image..."
            docker compose -f /opt/mossina/docker-compose.yml pull

            echo "==> Pruning old images to free disk space..."
            docker image prune -f

            echo "==> Writing secrets to .env file..."
            # docker compose reads /opt/mossina/.env automatically.
            # File is root-only readable so secrets stay off the filesystem.
            cat > /opt/mossina/.env << ENV
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
            ENV
            chmod 600 /opt/mossina/.env
            echo "    .env written"

            echo "==> Syncing cron jobs..."
            cat > /etc/cron.d/mossina << CRON
            # Mossina - managed by GitHub Actions. Do not edit manually.
            SHELL=/bin/bash
            PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

            # 02:00 - Full scrape, log stats + Telegram notification, ping healthchecks
            0 2 * * * root docker compose --env-file /opt/mossina/.env -f /opt/mossina/docker-compose.yml run --rm scraper python scrape.py >> /var/log/mossina-scrape.log 2>&1 && docker compose --env-file /opt/mossina/.env -f /opt/mossina/docker-compose.yml run --rm scraper python scripts/log_stats.py >> /var/log/mossina-scrape.log 2>&1 && curl -fsS --retry 3 ${HEALTHCHECK_URL} > /dev/null

            # 04:00 - Regenerate HTML visualisation
            0 4 * * * root docker compose --env-file /opt/mossina/.env -f /opt/mossina/docker-compose.yml run --rm visualizer python visualize.py >> /var/log/mossina-viz.log 2>&1
            CRON
            chmod 0644 /etc/cron.d/mossina
            echo "    Cron jobs synced"

            echo "==> Ensuring log files exist..."
            touch /var/log/mossina-scrape.log /var/log/mossina-viz.log

            echo "==> Starting web server..."
            docker compose -f /opt/mossina/docker-compose.yml up -d web
            echo "    Web server running at http://$(curl -fsS ifconfig.me):8080"

            echo "==> Deploy complete"
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
