name: Scrape Wizz Air

on:
  schedule:
    - cron: '0 1 * * *'   # 03:00 Berlin (01:00 UTC)
  workflow_dispatch:

jobs:
  scrape:
    name: Run Wizz Air scraper
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Run scraper on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 120m
          script: |
            set -e
            cd ~/mossina-dev
            git pull --ff-only
            docker compose build scraper
            docker compose run --rm scraper python cli.py --airline W6 -r 0 -w 5

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"❌ Wizz Air scrape FAILED — check GitHub Actions"}'

      - name: Notify Telegram on success
        if: success()
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id":"${{ secrets.TELEGRAM_CHAT_ID }}","text":"✅ Wizz Air scrape completed"}'
