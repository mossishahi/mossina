name: Scrape Wizz Air (on-demand)

on:
  workflow_dispatch:

jobs:
  scrape:
    name: Trigger W6 Scrape on Server
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Trigger scrape via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 100m
          script: |
            set -e
            cd ~/mossina-dev
            echo "Starting Wizz Air scrape..."
            docker compose --profile scraper run --rm scraper python cli.py --airline W6 -r 0 -w 3
            echo "Scrape complete."

      - name: Notify Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="Wizz Air scrape completed successfully"
          else
            MSG="Wizz Air scrape failed — check Actions log"
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\", \"text\": \"$MSG\"}" \
            > /dev/null 2>&1 || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
